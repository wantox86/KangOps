server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API container -- avoids needing CORS config entirely, and
    # matches the Vite dev-server proxy behavior (see vite.config.ts) so the app talks to
    # "/api/..." the same way in dev and in Compose.
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: unknown paths resolve to index.html, not a 404 -- there's no client-side
    # routing yet in Milestone 1, but this is the standard posture once there is.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
