services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/kangdocker.sqlite
    volumes:
      - kangdocker_data:/data
    # No Docker socket mount -- Milestone 1 has no collector yet, and even once it exists
    # (Milestone 2) the spec calls for a socket proxy with an allowlist, not a raw mount here.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint starts as root to chown the (fresh, root-owned-by-default) /data volume, then
    # drops to the non-root "node" user via su-exec before exec'ing the app -- these 3
    # capabilities are what that chown+setuid dance actually needs, everything else stays
    # dropped. The app process itself never runs as root or holds any of these.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped
    ports:
      # Host port 8085, not 8080 -- 8080 is already taken by monthly-journal-api if this ever
      # runs on the same homelab Docker host (MACMINI) it's meant to observe.
      - "${WEB_PORT:-8085}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx's official entrypoint chowns /var/cache/nginx/* and its master process drops from
    # root to the "nginx" user (uid 101) internally at startup -- same chown+setuid dance as
    # the api service, same 3 capabilities needed. NET_BIND_SERVICE is NOT needed since
    # nginx.conf listens on 8080, not a privileged (<1024) port.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  kangdocker_data:
